<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <h1>Exercício 1: Formatador de Texto</h1>
    
    <label for="textoInput">Texto:</label><br>
    <textarea name="textoInput" id="textoInput" rows="5" cols="40"></textarea>
    <br>
    <button type="button" id="btnSalvar">Salvar Texto</button>
    
    <br><br>
    
    <div id="textoDisplay" style="font-size: 16px; min-height: 30px; padding: 10px; margin-bottom: 10px;"></div>
    
    <button type="button" id="btnAumentar">+</button>
    <button type="button" id="btnDiminuir">-</button>
    <button type="button" id="btnNegrito">B</button>
    <button type="button" id="btnItalico">I</button>

    <script src="script.js" type="text/javascript"></script>
</body>
</html>
